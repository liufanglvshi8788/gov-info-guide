<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算器与决策向导 · 工作人员速查版</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-box { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; }
.tool-box h3 { font-size: 15.5px; color: var(--primary); margin-bottom: 12px; }
.tool-box label { font-size: 13px; color: #555; display: block; margin-bottom: 4px; }
.tool-box input[type="date"], .tool-box select { padding: 8px 12px; border: 1px solid #c0ccd8; border-radius: 8px; font-size: 14px; margin-bottom: 10px; }
.tool-box .btn { margin-top: 6px; }
.result-box { background: #eef4fb; border-radius: 8px; padding: 14px 18px; margin-top: 12px; font-size: 13.5px; line-height: 2; display: none; }
.result-box .deadline { color: var(--danger); font-weight: 700; font-size: 16px; }
.step-q { background: #f8fafc; border: 1px solid #d4e6f1; border-radius: 10px; padding: 16px 18px; margin-bottom: 12px; }
.step-q .qtext { font-size: 14.5px; font-weight: 700; color: var(--primary); margin-bottom: 10px; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; }
.opt { background: #fff; border: 1.5px solid #c0ccd8; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
.opt:hover { border-color: var(--primary-light); }
.opt.selected { border-color: var(--primary); background: #eef4fa; font-weight: 700; }
.concl { background: #eaf6f1; border-left: 4px solid var(--success); border-radius: 0 8px 8px 0; padding: 12px 16px; margin-top: 12px; font-size: 13.5px; line-height: 2; display: none; }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand">
      <span class="logo">速</span>
      <span class="name">政府信息公开事项处理<small>工作人员速查版 · 前置指引</small></span>
    </a>
    <nav class="topnav">
      <a href="index.html">收到申请怎么办</a>
      <a href="answers.html">答复类型速查</a>
      <a href="samples.html">模板直用</a>
      <a href="tools.html" class="active">计算器与向导</a>
      <a href="faq.html">高频问答</a>
      <a href="checklist.html">发出前自查</a>
      <a href="../index.html" style="background:rgba(255,255,255,.15);border-radius:16px;">法律顾问完整版 →</a>
    </nav>
    <button class="menu-btn" onclick="document.querySelector('.topnav').classList.toggle('open')">☰</button>
  </div>
</div>
<div class="staff-wrap">
  <div class="staff-hero">
    <h1>时限计算器与答复决策向导</h1>
    <p>输入收件日期自动算届满日；按实际情况逐题选择，自动给出答复类型与依据。</p>
  </div>

  <div class="tool-box">
    <h3>① 答复时限计算器</h3>
    <label>收到申请日期（按条例第31条认定）</label>
    <input type="date" id="recv">
    <div style="margin-top:6px">
      <label style="display:inline">是否经过补正？</label>
      <select id="amend" style="margin-left:6px"><option value="no">未补正</option><option value="yes">已补正（补正材料收到之日重新起算）</option></select>
    </div>
    <div style="margin-top:6px">
      <label style="display:inline">是否延长？</label>
      <select id="ext" style="margin-left:6px"><option value="no">不延长</option><option value="20">延长 20 个工作日（最长）</option></select>
    </div>
    <button class="btn" onclick="calcStaff()">计算届满日</button>
    <div class="result-box" id="res"></div>
  </div>

  <div class="tool-box">
    <h3>② 答复类型决策向导</h3>
    <div id="tree"></div>
    <button class="btn" style="margin-top:10px;background:#7f8c8d" onclick="resetTree()">重新开始</button>
  </div>

  <p class="staff-footer-note">完整版计算器（补正日期选择、延长天数档位、送审截止日、节假日配置）→ <a href="../calculator.html">法律顾问完整版·时限计算器</a></p>
</div>
<footer class="footer">
  <div class="f-title">政府信息公开事项处理 · 工作人员速查版</div>
  依据《中华人民共和国政府信息公开条例》（国务院令第711号）及配套现行有效规定编制<br>
  内部工作指引 · 详细条文见法律顾问完整版
</footer>
<script>
const holidays = []; // 如需排除法定节假日，在此配置，如 "2026-10-01"
function isWorkday(d) { const day = d.getDay(); if (day === 0 || day === 6) return false; if (holidays.includes(d.toISOString().slice(0,10))) return false; return true; }
function addWorkdays(start, n) { let d = new Date(start); let c = 0; while (c < n) { d.setDate(d.getDate() + 1); if (isWorkday(d)) c++; } return d; }
function fmt(d) { const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0'); const w = ['日','一','二','三','四','五','六'][d.getDay()]; return y + '-' + m + '-' + dd + '（周' + w + '）'; }
function calcStaff() {
  const recv = new Date(document.getElementById('recv').value + 'T00:00:00');
  if (isNaN(recv)) { alert('请选择收到申请日期'); return; }
  const amend = document.getElementById('amend').value === 'yes';
  const ext = document.getElementById('ext').value === '20';
  const start = recv;
  const d20 = addWorkdays(start, 20);
  const d40 = ext ? addWorkdays(start, 40) : null;
  const today = new Date(); today.setHours(0,0,0,0);
  const left = Math.ceil((d20 - today) / 86400000);
  let h = '<table style="width:100%;border-collapse:collapse;font-size:13px"><tr><td style="padding:6px;width:46%">收到申请之日</td><td style="padding:6px">' + fmt(start) + (amend ? '（补正后重新起算）' : '') + '</td></tr>';
  h += '<tr><td style="padding:6px">20 个工作日届满日</td><td style="padding:6px" class="deadline">' + fmt(d20) + '</td></tr>';
  if (d40) h += '<tr><td style="padding:6px">延长后届满日</td><td style="padding:6px" class="deadline">' + fmt(d40) + '</td></tr>';
  h += '<tr><td style="padding:6px">剩余时间</td><td style="padding:6px">' + (left < 0 ? '已逾期 ' + (-left) + ' 天！' : '剩 ' + left + ' 天') + '</td></tr>';
  h += '<tr><td style="padding:6px">送审截止</td><td style="padding:6px">' + fmt(addWorkdays(start, 10)) + '（最迟第10个工作日）</td></tr></table>';
  const r = document.getElementById('res');
  r.innerHTML = h; r.style.display = 'block';
}
const QS = [
  { q: '1. 申请内容是否明确？', opts: ['明确', '不明确'], next: { '明确': 1, '不明确': 'r:补正' } },
  { q: '2. 是否属政府信息（行政管理中制作或获取的信息）？', opts: ['是', '否'], next: { '是': 2, '否': 'r:不属于政府信息' } },
  { q: '3. 是否本单位职责？', opts: ['是', '否'], next: { '是': 3, '否': 'r:不属于本机关' } },
  { q: '4. 检索是否找到该信息？', opts: ['找到', '未找到'], next: { '找到': 4, '未找到': 'r:信息不存在' } },
  { q: '5. 是否属于不予公开情形（国家秘密/法定禁止/三安全一稳定/商业秘密个人隐私/内部事务/过程性/执法案卷）？', opts: ['属于', '不属于'], next: { '属于': 'r:不予公开', '不属于': 'r:予以公开' } }
];
const CONCL = {
  '补正': { t: '告知补正', d: '7个工作日内一次性告知补正事项和合理期限（条例第30条）。', s: '../samples.html#s10' },
  '不属于政府信息': { t: '告知不属于政府信息', d: '说明理由并告知业务查询等相应渠道（条例第2条；国办公开办函〔2016〕206号）。', s: '../samples.html' },
  '不属于本机关': { t: '告知不属于本机关公开', d: '说明理由，能确定负责机关的告知名称、联系方式（条例第36条(五)）。', s: '../samples.html#s5' },
  '信息不存在': { t: '告知信息不存在', d: '附检索留痕证据（条例第36条(四)；法释〔2025〕8号第5条）。', s: '../samples.html#s4' },
  '不予公开': { t: '决定不予公开', d: '逐项说明理由并引第14/15/16条；救济告知写"先申请行政复议"（复议前置，复议法第23条(四)）。', s: '../samples.html#s3' },
  '予以公开': { t: '予以公开', d: '提供信息或告知获取方式、途径和时间（条例第36条(二)）。', s: '../samples.html#s1' }
};
let cur = 0, path = [];
function renderTree() {
  const box = document.getElementById('tree');
  if (typeof cur === 'string') {
    const c = CONCL[cur.replace('r:', '')];
    box.innerHTML = '<div class="concl" style="display:block"><b>结论：' + c.t + '</b><br>' + c.d + '<br><a href="' + c.s + '">使用对应模板 →</a></div>';
    return;
  }
  const s = QS[cur];
  box.innerHTML = '<div class="step-q"><div class="qtext">' + s.q + '</div><div class="opts">' + s.opts.map(o => '<button class="opt" onclick="pick(\'' + o + '\')">' + o + '</button>').join('') + '</div></div>';
}
function pick(o) { cur = QS[cur].next[o]; renderTree(); }
function resetTree() { cur = 0; renderTree(); }
renderTree();
</script>
</body>
</html>
